# Lancer Jenkins en local :  docker compose up -d   (puis ouvrir http://localhost:8081)
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-tp
    restart: unless-stopped
    ports:
      - "8081:8080"     # interface web (8081 pour ne pas entrer en conflit avec l'appli Spring Boot sur 8080)
      - "50000:50000"   # agents distants
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:

name: CI/CD

# Quand ? A chaque push sur main, a chaque pull request vers main, ou a la demande (bouton "Run workflow")
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales (bonne pratique de securite)
permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------
  # 1) BUILD : compiler et produire le JAR (conserve comme artefact)
  # ---------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compiler et empaqueter (sans les tests)
        run: mvn -B clean package -DskipTests

      - name: Conserver le JAR comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) TEST : tests unitaires + integration + couverture JaCoCo
  # ---------------------------------------------------------------
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # "verify" = compile + tests (surefire) + rapport et seuil de couverture (jacoco)
      - name: Lancer les tests
        run: mvn -B verify

      - name: Resume de la couverture dans l'onglet du run
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Couverture des lignes : %.1f %%\n", (c/(m+c))*100}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            target/surefire-reports
            target/site/jacoco

  # ---------------------------------------------------------------
  # 3) DEPLOY : seulement sur main, apres des tests verts
  # ---------------------------------------------------------------
  deploy:
    name: Deploy (simule)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Recuperer le JAR produit par le job build
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artefact

      - name: Demarrer l'application et verifier qu'elle repond (smoke test)
        run: |
          ls -lh artefact
          java -jar artefact/*.jar > app.log 2>&1 &
          curl --silent --show-error --fail \
               --retry 20 --retry-delay 2 --retry-connrefused \
               http://localhost:8080/api/produits
          echo
          tail -n 5 app.log

      - name: Deploiement du JAR (simule)
        run: echo "Deploiement du JAR en production... (remplacer par scp, docker push, etc.)"
